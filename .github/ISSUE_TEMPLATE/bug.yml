name: Bug report
description: Something in ALEA is broken or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run (for example `just test`) and any config used.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, architecture, Python version, GPU or CPU.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
    validations:
      required: false
