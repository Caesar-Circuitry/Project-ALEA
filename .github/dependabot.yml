version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # v6 moved caching into a proprietary component (gradle-actions-caching); stay on v5 until the team decides.
    ignore:
      - dependency-name: "gradle/actions"
        versions: [">=6"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /robot
    schedule:
      interval: weekly
