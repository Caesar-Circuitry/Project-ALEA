// TeamCode-only module on FTC SDK 12.0.0 (published artifacts on Maven Central).
// The FtcRobotController app is not included: assembleDebug builds TeamCode as an app
// so CI proves the code compiles and dexes against the real SDK.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    compileSdk = 34

    defaultConfig {
        applicationId = 'org.firstinspires.ftc.teamcode'
        minSdk = 24
        targetSdk = 28
        versionCode = 1
        versionName = '1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // FTC SDK 12.0.0
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'

    // PsiKit 0.2.0 (repo.dairy.foundation); the ftc POM lists core as runtime-only,
    // and the Java here uses Logger from core, so declare both.
    implementation 'org.psilynx.psikit:core:0.2.0'
    implementation 'org.psilynx.psikit:ftc:0.2.0'
}
