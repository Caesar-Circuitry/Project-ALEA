site_name: ALEA
site_description: Strategy analysis platform of FTC team 24331 Caesar Circuitry
repo_url: https://github.com/Caesar-Circuitry/Project-ALEA
theme:
  name: material
  logo: assets/badge.png
  favicon: assets/badge.png
  font:
    text: Open Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
extra_css:
  - stylesheets/ep.css
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - tables
nav:
  - Home: README.md
  - Summary: summary.md
  - Knowledge base: knowledge-base.md
  - Technical binder: technical-binder.md
  - Robot interface: robot-interface.md
  - Decisions:
      - decisions/README.md
      - 0001 Scope and stack: decisions/0001-scope-and-stack.md
      - 0002 Robot contract: decisions/0002-robot-contract.md
      - 0003 Agentic workflow: decisions/0003-agentic-workflow-and-models.md
      - 0004 Branch protection: decisions/0004-branch-protection.md
      - 0005 Hifi dsim port: decisions/0005-hifi-dsim-port.md
      - 0006 Agent sandbox: decisions/0006-agent-sandbox.md
      - 0007 Launch detection: decisions/0007-launch-detection.md
      - 0008 Video geometry and click log: decisions/0008-video-geometry-and-click-log.md
