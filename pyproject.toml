[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alea"
version = "0.1.0"
description = "ALEA: FTC team 24331 Caesar Circuitry strategy analysis platform (BIOBUZZ 2026-27)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  # Warp dropped Intel macOS after 1.9.x; keep a best-effort fork for it.
  "warp-lang>=1.10; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "warp-lang<1.10; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "scipy>=1.14",
  "hydra-core>=1.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
# NVIDIA-only. RAPIDS (cudf, cuml) is installed from NVIDIA's index; see README.
gpu = ["cupy-cuda12x>=13; sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine == 'AMD64')"]
# Robot log import. robotpy-wpiutil ships no Windows-arm64 wheel.
logs = ["robotpy-wpiutil>=2025; sys_platform != 'win32' or platform_machine != 'ARM64'"]
video = [
  "opencv-python-headless>=4.10; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "rerun-sdk>=0.20; sys_platform != 'win32' or platform_machine != 'ARM64'",
]
ml = ["scikit-learn>=1.5", "mlflow>=2.17"]
web = ["streamlit>=1.40", "fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "pre-commit>=4.0",
  "jupyterlab>=4.3",
  "jupytext>=1.16",
  "nbstripout>=0.8",
  "mkdocs-material>=9.5",
]

[tool.uv]
# Every platform the CPU path must resolve for. uv lock fails loudly if one cannot.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'win32' and platform_machine == 'ARM64'",
]

[tool.hatch.build.targets.wheel]
packages = ["alea"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb", "robot", "hpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]

[tool.pyright]
include = ["alea", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs an NVIDIA GPU; run on Brev with `pytest -m gpu`",
  "slow: takes more than about a minute",
]
addopts = "-m 'not gpu' -ra"

[tool.coverage.run]
source = ["alea"]
